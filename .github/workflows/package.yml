name: Multi-Platform Package (Windows & macOS)

on:
  push:
    branches: [ main, feature/mac-support ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Package Windows (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package Windows Executables
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:win

      - name: Archive Unpacked Distribution
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath "release\Horizon-$ver-win-unpacked.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-windows
          retention-days: 14
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  package-macos:
    name: Package macOS (DMG & ZIP)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Native Modules
        run: npm ci

      - name: Rebuild Native Dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Build & Package macOS Artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-macos
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [package-windows, package-macos]
    # Only publish to the official release on tag pushes (v*), main branch, or manual dispatch.
    # Feature branches build and upload workflow artifacts, but do not overwrite the official release.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: horizon-*
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG="$PKG_VER"

          echo "Publishing assets to release tag: $TAG"

          # Verify or create release if missing
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG not found. Creating new release..."
            gh release create "$TAG" --title "Horizon PM $TAG" --generate-notes
          fi

          # Upload all packages sequentially in a single job without collisions
          echo "Uploading binaries to release $TAG..."
          gh release upload "$TAG" release-assets/* --clobber
