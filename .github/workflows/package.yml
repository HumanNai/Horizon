name: Multi-Platform Package (Windows & macOS)

on:
  push:
    branches: [ main, feature/mac-support ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Package Windows (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package Windows Executables
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:win

      - name: Archive Unpacked Distribution
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath "release\Horizon-$ver-win-unpacked.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-windows
          retention-days: 14
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Attach Windows Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/mac-support'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkgVer = node -p "'v' + require('./package.json').version"
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10) } else { $pkgVer }
          $files = (Get-Item release/*.exe, release/*.zip).FullName
          gh release upload $tag $files --clobber

  package-macos:
    name: Package macOS (DMG & ZIP)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Native Modules
        run: npm ci

      - name: Build & Package macOS Artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-macos
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach macOS Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/mac-support'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG="$PKG_VER"
          gh release upload "$TAG" release/*.dmg release/*.zip --clobber


