name: Attach Windows Binaries to Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/attach-windows.yml'

permissions:
  contents: write

jobs:
  upload-windows:
    name: Attach Windows Executables
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: horizon-windows-1.1.0
          run-id: 35063702663
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: win-artifacts

      - name: Verify Windows Files
        run: ls -lh win-artifacts

      - name: Upload Windows Executables to Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.1.0 win-artifacts/* --clobber --repo ${{ github.repository }}
